# Publishes to PyPI via Trusted Publishing (OIDC) — no API token secrets needed.
# One-time setup on https://pypi.org: project Settings -> Publishing -> add a
# "GitHub" trusted publisher with this repo, workflow file name "publish.yml",
# and environment "pypi". Same on https://test.pypi.org with environment
# "testpypi" for the TestPyPI job.
name: Publish

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # A release tag must name the version being published (v0.4.1 -> 0.4.1);
      # PyPI never accepts the same version twice, so a mismatch is unrecoverable.
      - name: Tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/safestream_redactor/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package version $version"; exit 1
          fi
      # metadata and the PyPI README must render, or the upload is rejected
      - run: twine check --strict dist/*
      # install each artifact into a clean environment and run the CLI
      - name: Smoke-test the wheel and the sdist
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            python -m venv "/tmp/venv-$$" && "/tmp/venv-$$/bin/pip" install -q "$artifact"
            "/tmp/venv-$$/bin/safestream" --version
            out=$(printf 'mail bob@corp.io\n' | "/tmp/venv-$$/bin/safestream" redact - -o -)
            test "$out" = "mail [REDACTED]"
            rm -rf "/tmp/venv-$$"
          done
      # unfinished subsystems must never reach PyPI (see [tool.hatch.build])
      - name: No unfinished packages in the artifacts
        run: |
          set -euo pipefail
          if unzip -l dist/*.whl | grep -q memstream; then
            echo "::error::memstream/ leaked into the wheel"; exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -q memstream; then
            echo "::error::memstream/ leaked into the sdist"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    # manual dry-runs: gh workflow run publish.yml
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
