# Releases safestream-redactor via PyPI Trusted Publishing (OIDC): no API token is
# stored anywhere. Only this one project is published; the optional Rust core in
# native/ is built and tested by native-wheels.yml but not uploaded.
#
#   GitHub release published (tag vX.Y.Z)  ->  build, test, upload to PyPI
#   Actions -> Publish -> Run workflow     ->  target "check": build and test only
#                                              target "testpypi": a full dry run that
#                                              uploads X.Y.(Z+1).dev<run number>
#
# One-time setup (docs/RELEASING.md): on pypi.org AND test.pypi.org, add a GitHub
# trusted publisher to safestream-redactor with this repo, workflow "publish.yml"
# and environment "pypi" (resp. "testpypi").
name: Publish

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "check = build and test only; testpypi = also upload a dev version"
        type: choice
        options: [check, testpypi]
        default: check

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      # empty = build the checkout's own version (a release, or a check run)
      stamp: ${{ steps.v.outputs.stamp }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/safestream_redactor/__init__.py)
          if [ "${{ github.event_name }}" = release ]; then
            # PyPI never accepts the same version twice, so a mismatch is unrecoverable
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::release tag $GITHUB_REF_NAME does not match package version $version"
              exit 1
            fi
          elif [ "${{ inputs.target }}" = testpypi ]; then
            # TestPyPI also takes each version once: a unique dev release of the next
            # patch, so dry runs repeat freely and never shadow a real version
            IFS=. read -r major minor patch <<< "${version%%[a-z]*}"
            stamp="$major.$minor.$((patch + 1)).dev${{ github.run_number }}"
            echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
            version=$stamp
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.stamp }}

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [version, package]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true # a re-run attempt re-uploads the same dev version

  # Install the dry run back from TestPyPI, exactly as a user would, on every OS.
  verify-testpypi:
    name: "pip install from TestPyPI (${{ matrix.os }})"
    needs: [version, publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Only our project comes from TestPyPI (--no-deps): anyone can upload there,
      # so a dependency such as cryptography must never be resolved against it. The
      # index can take a minute to serve a new upload, hence the retries.
      - run: |
          v="${{ needs.version.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            python -m pip install --no-cache-dir --no-deps -i https://test.pypi.org/simple/ \
              "safestream-redactor==$v" && break
            [ "$attempt" = 6 ] && exit 1
            sleep 20
          done
          # the extra's dependencies, resolved from PyPI; ours is already satisfied
          python -m pip install "safestream-redactor[crypto]==$v"
      - run: python scripts/smoke_test.py --crypto

  publish-pypi:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
