# Builds the pure-Python distribution (wheel + sdist) and installs it the way users
# do: from the built artifact, into a clean interpreter, on every OS, at both ends
# of the supported CPython range. ci.yml tests an editable checkout. This tests what
# actually ships. publish.yml calls it before every upload, so nothing reaches PyPI
# without passing here. The native wheel is tested by native-wheels.yml.
name: Package

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: "Stamp this version before building (TestPyPI dry runs); empty keeps the checkout's"
        type: string
        default: ""

concurrency:
  # a literal prefix: under workflow_call, github.workflow is the caller's name
  group: package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - if: inputs.version != ''
        run: python scripts/set_version.py "${{ inputs.version }}"
      - run: pip install build twine
      - run: python -m build
      # metadata and the PyPI README must render, or the upload is rejected
      - run: twine check --strict dist/*
      # unfinished subsystems must never reach PyPI (see [tool.hatch.build])
      - name: No unfinished packages in the artifacts
        run: |
          set -euo pipefail
          if unzip -l dist/*.whl | grep -q memstream; then
            echo "::error::memstream/ leaked into the wheel"; exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -q memstream; then
            echo "::error::memstream/ leaked into the sdist"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install:
    name: install wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      # only scripts/smoke_test.py is used from the checkout; the package under
      # test is the built wheel (the src/ layout keeps the checkout off sys.path)
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python -m pip install "$(ls dist/*.whl)[crypto,ui]"
      - run: python scripts/smoke_test.py --crypto --ui

  install-linux:
    name: install sdist, pipx, musl
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # pip builds the wheel from the sdist, as on a platform it has no wheel for
      - name: sdist
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/pip install dist/*.tar.gz
          /tmp/sdist/bin/python scripts/smoke_test.py
      - name: pipx run (no --from needed)
        run: pipx run --spec "$(ls dist/*.whl)" safestream-redactor --version
      - name: Alpine (musl libc)
        run: >
          docker run --rm -v "$PWD:/w" -w /w python:3.12-alpine
          sh -c 'pip install -q dist/*.whl && python scripts/smoke_test.py'
