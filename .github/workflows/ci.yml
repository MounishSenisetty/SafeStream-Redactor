name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.14 is the interpreter the container image ships, so it is tested too
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # the scheduler, netguard, and atomic writes touch OS-specific
          # surfaces (sockets, /proc, process spawn, os.replace) — exercise
          # them on every OS at least once
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      # the spaCy NER tier is on by default; its model is not on PyPI
      - run: python -m spacy download en_core_web_sm
      # Coverage gate runs on Linux, where every platform-specific subsystem
      # (RLIMIT_AS memory enforcement, seccomp/netns hard offline modes) actually
      # executes. macOS/Windows run the identical suite for portability but
      # without the coverage gate: their Linux-only kernel code is unreachable
      # there, so measuring coverage on those runners would skew the percentage
      # rather than reveal a real gap. fail_under is configured in pyproject.toml.
      - name: tests + coverage gate (Linux)
        if: runner.os == 'Linux'
        run: pytest -q --cov=safestream_redactor --cov-report=term
      - name: tests (portability, no coverage gate)
        if: runner.os != 'Linux'
        run: pytest -q
      # smaller variant of the constant-memory proof to keep CI fast;
      # run the full 1 GB check locally with: pytest -m memory -o addopts=''
      - run: pytest -m memory -o addopts='' -q
        if: runner.os == 'Linux'
        env:
          SAFESTREAM_MEMTEST_MB: "64"

  quality:
    # detection-quality gate on the adversarial corpus: catches a pattern or
    # scoring change that trades away precision/recall before it can merge. It
    # runs the default pipeline, spaCy included, so it also catches a spaCy span
    # displacing a rule-based match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # the spaCy NER tier is on by default; its model is not on PyPI
      - run: python -m spacy download en_core_web_sm
      - run: python benchmarks/generate_hard_dataset.py --size-mb 1
      - run: >
          python benchmarks/run_benchmark.py --data benchmarks/data_hard
          --assert-precision 0.995 --assert-recall 0.999
      - run: python benchmarks/generate_dataset.py --size-mb 2
      - run: >
          python benchmarks/run_benchmark.py --data benchmarks/data
          --assert-precision 0.999 --assert-recall 0.999

  ui:
    # The optional web playground ([ui] extra). The other jobs never install
    # Streamlit: they cover ui/core.py and the launcher, and skip the page tests.
    # Here the page runs for real, and mypy checks it against Streamlit's own
    # annotations (elsewhere Streamlit is untyped).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev,ui]
      # the spaCy NER tier is on by default; its model is not on PyPI
      - run: python -m spacy download en_core_web_sm
      - run: mypy
      - run: pytest -q tests/test_ui_core.py tests/test_ui_launcher.py tests/test_ui_app.py
      - name: safestream ui boots on loopback only
        run: |
          safestream ui --headless --port 8599 &
          for _ in $(seq 1 30); do
            curl -sf --noproxy '*' http://127.0.0.1:8599/_stcore/health && break
            sleep 1
          done
          curl -sf --noproxy '*' http://127.0.0.1:8599/_stcore/health
          # bound to loopback: the same port on this host's LAN address refuses
          lan_ip=$(hostname -I | awk '{print $1}')
          test -n "$lan_ip"
          if curl -sf --noproxy '*' --max-time 3 "http://$lan_ip:8599/_stcore/health"; then
            echo "::error::the web UI is reachable on $lan_ip"; exit 1
          fi
          kill %1

  audit:
    # fail on known vulnerabilities in the (few) resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pip-audit
      - run: pip-audit
