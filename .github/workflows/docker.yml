# Publishes the container image to GHCR on release, with an SBOM and build
# provenance attached (buildx attestations), for linux/amd64 and linux/arm64.
# Manual dry-runs (workflow_dispatch) build every platform but push nothing.
name: Docker

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Exercise the real image before anything is pushed: a native-arch build
      # loaded into the local daemon, run exactly as the README documents.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: safestream-redactor:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          img=safestream-redactor:smoke
          docker run --rm "$img" --version
          test "$(docker run --rm --entrypoint id "$img" -u)" = 10001
          mkdir data
          printf 'mail bob@corp.com\r\nkey AKIAIOSFODNN7EXAMPLF\r\n' > data/in.txt
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data":/data "$img" \
            redact /data/in.txt -o /data/out.txt
          docker run --rm -i --network none --read-only --cap-drop ALL "$img" \
            redact - -o - < data/in.txt > data/out_stdin.txt
          cmp data/out.txt data/out_stdin.txt
          if grep -qE 'bob@corp\.com|AKIAIOSFODNN7EXAMPLF' data/out.txt; then
            echo "::error::image left a secret unredacted"; exit 1
          fi
          grep -q $'\r' data/out.txt  # line endings pass through untouched
      - uses: docker/login-action@v4
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safestream-redactor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
