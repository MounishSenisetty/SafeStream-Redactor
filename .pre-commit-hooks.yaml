# Pre-commit hook definitions for SafeStream-Redactor.
#
# Consumers add this to their own .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/MounishSenisetty/SafeStream-Redactor
#       rev: v0.4.0
#       hooks:
#         - id: safestream-detect
#
# The hook blocks a commit whose staged files contain detectable secrets or
# PII. It runs entirely locally (the offline guard stays on) and never prints
# the matched secret (detect hides it by default) — only its type,
# file:line:col location, and confidence.
- id: safestream-detect
  name: SafeStream secret/PII scan
  description: Block commits that introduce detectable secrets or PII.
  entry: safestream detect --fail-on-detect
  language: python
  # The spaCy PERSON/ORG/LOC tier is on by default and its model is not on PyPI,
  # so it is pinned here by URL and sha256 (pip verifies the #sha256 fragment).
  additional_dependencies:
    - "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
  # Scan text-like files by default; consumers can override `files`/`exclude`.
  types: [text]
  # pre-commit passes the staged files as positional INPUT arguments.
  # `detect` exits non-zero when anything is found, which fails the hook.
