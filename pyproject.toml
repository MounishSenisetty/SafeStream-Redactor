[build-system]
# >=1.27: first release emitting PEP 639 metadata (the SPDX `license` string and
# `license-files` below); older hatchling rejects this [project] table.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "safestream-redactor"
dynamic = ["version"]
description = "Streaming PII & credential detection/redaction for very large text files with constant memory usage."
# PyPI-specific description: prose only, no Mermaid diagram source and no
# repo-relative file links (those render as broken paths on the PyPI page).
# The rich GitHub README (diagrams + deep links) stays at ./README.md.
readme = "src/README_PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
# All three names carry no email so they render together in a single PyPI
# "Author" field. Giving only one an email split it into a separate
# Author-email metadata field, which is why one name went missing on PyPI.
authors = [
    { name = "Mounish Senisetty" },
    { name = "Ashrith" },
    { name = "Sandhiya" },
]
maintainers = [
    { name = "Mounish Senisetty", email = "senisettymounish@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["pii", "redaction", "privacy", "security", "streaming", "secrets", "dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Text Processing :: Filters",
  "Typing :: Typed",
]
dependencies = [
  # tomllib is stdlib from 3.11; tomli is the identical backport for 3.10
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ner = ["spacy>=3.5"]
# Local ONNX NER tier (detectors/onnx_ner.py): an on-device token-classification
# model for PERSON/ORG/LOC, run via onnxruntime with no data egress. Optional and
# lazily imported; the base install stays pure-Python. Bring your own .onnx model
# + vocab (Redactor(backend unaffected); see docs/DETECTORS.md).
onnx = ["onnxruntime>=1.16", "numpy>=1.21"]
# Optional compiled detection core (Rust, built from native/ — see
# docs/NATIVE_CORE.md). A byte-identical accelerator for the deterministic tier,
# selected with Redactor(backend="native"); the base install stays pure-Python and
# dependency-free, and backend="native" falls back to Python when this is absent.
# The wheel is a separate distribution published by .github/workflows/native-wheels.yml;
# a runtime spec-guard falls back to Python if a version-skewed wheel is paired.
# Bounded to the lockstep minor series: a newer native minor may carry a different
# pattern spec (the runtime spec-guard would then silently fall back to Python).
native = ["safestream-redactor-native>=0.4.0,<0.5"]
# ruff is pinned to a minor series: its formatter output changes between minors,
# and an unpinned CI once failed `ruff format --check` on code that was clean
# locally. Bump it together with the ruff rev in .pre-commit-config.yaml.
# pyyaml lets tests/test_ci_integrations.py validate the pre-commit hook and the
# GitHub Action; without it that module is skipped, silently.
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "hypothesis>=6.90",
  "ruff>=0.15.8,<0.16",
  "mypy>=1.8",
  "pyyaml>=6.0",
  "pre-commit>=3.5",
]
# google-re2 is used only by benchmarks/re2_backend.py (the evaluated-and-not-
# adopted compiled-regex backend); it is never imported by the shipped package.
bench = ["presidio-analyzer>=2.2", "google-re2>=1.1"]
# Optional deps for the RedactionBench evaluation harness (benchmarks/redactionbench/).
# Only needed to DOWNLOAD the dataset from Hugging Face (`datasets`/`huggingface_hub`)
# or to read a vendored `.parquet` export (`pyarrow`); JSON/JSONL/CSV exports need
# none of these. The shipped package never imports them.
redactionbench = ["datasets>=2.14", "huggingface_hub>=0.20", "pyarrow>=12"]

[project.urls]
Homepage = "https://github.com/MounishSenisetty/SafeStream-Redactor"
Documentation = "https://github.com/MounishSenisetty/SafeStream-Redactor/tree/main/docs"
Issues = "https://github.com/MounishSenisetty/SafeStream-Redactor/issues"
Changelog = "https://github.com/MounishSenisetty/SafeStream-Redactor/blob/main/CHANGELOG.md"

[project.scripts]
safestream = "safestream_redactor.cli:main"

[tool.hatch.version]
path = "src/safestream_redactor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/safestream_redactor"]
# memstream/ is an unfinished subsystem (a planned crash-safe event log) that the
# redaction path never imports. It stays in the tree for its author but is not
# shipped: a published package should contain only supported, finished code.
exclude = ["src/safestream_redactor/memstream"]

# The sdist carries only what pip needs to build and install the package: the
# source (with its PyPI README) and the license; pyproject.toml, PKG-INFO and
# .gitignore (hatchling reads it when pip builds the wheel from this sdist) are
# always added. Tests, benchmarks, docs, datasets and CI files stay in the repo.
[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE"]
exclude = ["/src/safestream_redactor/memstream"]

[tool.pytest.ini_options]
addopts = "-m 'not memory'"
markers = [
  "memory: long-running constant-memory tests on large generated files (run with: pytest -m memory -o addopts='')",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["safestream_redactor"]
omit = [
  # trivial `python -m` shim; exercised via the console-script entry point
  "*/__main__.py",
]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if sys\\.version_info",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# Don't format Markdown: ruff's embedded-code-block formatting is unstable
# across versions (some default it on, some gate it behind preview), which made
# `ruff format --check` pass locally but fail in CI on README.md. Prose and doc
# snippets aren't code we gate on, so exclude them from the formatter entirely.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# these deliberately embed ambiguous Unicode (Arabic-Indic digits, accented Latin)
# to prove Unicode-boundary correctness / re2's ASCII-only divergence
"benchmarks/re2_backend.py" = ["RUF001"]
"tests/test_lookaround_free.py" = ["RUF001"]
"tests/test_native_backend.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# spaCy has no type stubs and is an optional dependency; the NER tier is
# imported lazily so the core install can skip it entirely. tomli is only
# installed on Python < 3.11 (stdlib tomllib elsewhere) and ships no stubs.
# onnxruntime (the [onnx] extra) ships no stubs and is likewise lazily imported.
# safestream_native (the [native] extra) is a stub-less compiled module that may
# or may not be installed; listing it keeps mypy green in both states.
module = ["spacy", "tomli", "onnxruntime", "numpy", "safestream_native"]
ignore_missing_imports = true
