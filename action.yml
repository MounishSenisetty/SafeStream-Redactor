name: "SafeStream secret & PII scan"
description: >-
  Fail the build when tracked files contain detectable secrets or PII. Runs
  fully offline and never prints the matched secret — only its type, location,
  and confidence. Optionally uploads a SARIF report to GitHub code scanning.
author: "SafeStream-Redactor"
branding:
  icon: "shield"
  color: "purple"

inputs:
  paths:
    description: "Space-separated files/directories to scan."
    required: false
    default: "."
  config:
    description: "Path to a TOML policy file (optional)."
    required: false
    default: ""
  sarif-file:
    description: "If set, write a SARIF report to this path (upload it separately)."
    required: false
    default: ""
  version:
    description: "Version of safestream-redactor to install from PyPI."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Inputs reach the scripts only through environment variables, never by
    # ${{ }} interpolation into the script text: an interpolated value is
    # spliced in before bash parses it, so a crafted input could run commands.
    - name: Install safestream-redactor
      shell: bash
      env:
        SAFESTREAM_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$SAFESTREAM_VERSION" ]; then
          python -m pip install "safestream-redactor==$SAFESTREAM_VERSION"
        else
          python -m pip install safestream-redactor
        fi

    - name: Scan for secrets and PII
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.paths }}
        SCAN_CONFIG: ${{ inputs.config }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        # SCAN_PATHS is space-separated by contract. Expanding the variable
        # unquoted word-splits and glob-expands it (so `src/*.py` still works)
        # but, unlike expression interpolation, never evaluates $(...) or backticks.
        # shellcheck disable=SC2206
        args=($SCAN_PATHS)
        if [ -n "$SCAN_CONFIG" ]; then args+=(--config "$SCAN_CONFIG"); fi
        if [ -n "$SARIF_FILE" ]; then
          # The SARIF report is content-free (no secret text) and safe to upload.
          safestream detect "${args[@]}" --sarif > "$SARIF_FILE"
        fi
        # detect never prints the matched value unless explicitly asked to, so
        # the build log lists only file:line:col, type, and confidence.
        safestream detect "${args[@]}" --fail-on-detect
